
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Checkbox - CSS Project | TechGuy 360</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="checkbox-card">
            <div class="card-icon"><i class="fa-solid fa-list-check"></i></div>
            <div class="card-header">
                <span class="eyebrow">PREFERENCES</span>
                <h1>Choose Your Skills</h1>
                <p>Select the technologies you are interested in learning.</p>
            </div>

            <div class="checkbox-list">
                <label class="checkbox-option">
                    <input type="checkbox">
                    <span class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="option-content">
                        <span class="option-title">HTML5</span>
                        <span class="option-description">Structure of web pages</span>
                    </span>
                    <i class="fa-brands fa-html5 technology-icon html"></i>
                </label>

                <label class="checkbox-option">
                    <input type="checkbox">
                    <span class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="option-content">
                        <span class="option-title">CSS3</span>
                        <span class="option-description">Styling and web design</span>
                    </span>
                    <i class="fa-brands fa-css3-alt technology-icon css"></i>
                </label>

                <label class="checkbox-option">
                    <input type="checkbox">
                    <span class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="option-content">
                        <span class="option-title">JavaScript</span>
                        <span class="option-description">Interactive web development</span>
                    </span>
                    <i class="fa-brands fa-js technology-icon js"></i>
                </label>

                <label class="checkbox-option">
                    <input type="checkbox">
                    <span class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </span>
                    <span class="option-content">
                        <span class="option-title">React.js</span>
                        <span class="option-description">Modern frontend development</span>
                    </span>
                    <i class="fa-brands fa-react technology-icon react"></i>
                </label>
            </div>

            <div class="card-footer">
                <i class="fa-solid fa-circle-info"></i>
                You can select multiple options.
            </div>
        </div>
    </main>
</body>
</html>
